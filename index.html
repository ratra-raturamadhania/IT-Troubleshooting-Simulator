<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Troubleshooting Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <div class="topbar">
      <div>
        <p class="label">IT SUPPORT LAB</p>
        <h1>Troubleshooting Simulator</h1>
      </div>

      <div class="top-info">
        <div class="progress-box">
          Case <span id="currentCase">1</span> of <span id="totalCase">5</span>
        </div>

        <div class="score">
          Score:
          <span id="score">0</span>
        </div>
      </div>
    </div>

    <section class="case-card" id="caseCard">

      <div class="case-header">
        <span id="caseNumber">CASE #001</span>
        <span class="status">OPEN</span>
      </div>

      <div class="problem">
        <p class="small">USER REPORT</p>
        <h2 id="caseTitle"></h2>
        <p id="caseDescription"></p>
      </div>

      <div class="device-info" id="deviceInfo"></div>

      <div class="question">
        <p>What would you do first?</p>
        <div class="buttons" id="answerButtons"></div>
      </div>

      <div id="result" class="result hidden"></div>

      <button id="nextButton" class="next-btn hidden" onclick="nextCase()">
        Next Case →
      </button>

    </section>

    <section id="finalScreen" class="final-screen hidden">
      <p class="small">SIMULATION COMPLETE</p>
      <h2>Your IT Support Score</h2>

      <div class="final-score" id="finalScore">
        0/50
      </div>

      <p id="finalMessage"></p>

      <button onclick="restartSimulator()">
        Restart Simulation
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
